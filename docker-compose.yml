# Всё приложение одной командой: docker compose up --build
#   http://localhost:3000 — фронтенд на React, http://localhost:8080 — страницы Thymeleaf и API.
# Для разработки достаточно только базы: docker compose up -d db
# Логины и пароли берутся из файла .env (он не хранится в git), см. README.
services:
  db:
    image: postgres:16
    container_name: cinerec-db
    environment:
      POSTGRES_DB: cinerec
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - cinerec-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cinerec"]
      interval: 5s
      retries: 10

  app:
    build: .
    container_name: cinerec-app
    environment:
      DB_HOST: db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Задайте ADMIN_PASSWORD в .env}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cinerec-frontend
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  cinerec-data:
