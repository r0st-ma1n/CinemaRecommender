# Локальная база PostgreSQL для разработки.
# Логин и пароль берутся из файла .env (он не хранится в git), см. README.
services:
  db:
    image: postgres:16
    container_name: cinerec-db
    environment:
      POSTGRES_DB: cinerec
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - cinerec-data:/var/lib/postgresql/data

volumes:
  cinerec-data:
