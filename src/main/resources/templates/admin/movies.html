<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Админка: фильмы')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container mb-5">
    <h1>Админка</h1>
    <div th:replace="~{fragments/layout :: adminTabs('movies')}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="text-muted" th:text="'Фильмов: ' + ${#lists.size(movies)}">Фильмов: 0</span>
        <a th:href="@{/admin/movies/new}" class="btn btn-success">+ Добавить фильм</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th>Название</th>
                <th>Год</th>
                <th>Тип</th>
                <th>Рейтинг</th>
                <th class="text-end">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="movie : ${movies}">
                <td><a th:href="@{/movies/{id}(id=${movie.id})}" th:text="${movie.title}">Название</a></td>
                <td th:text="${movie.year}">2000</td>
                <td th:text="${movie.type.name}">фильм</td>
                <td th:text="${#numbers.formatDecimal(movie.rating, 1, 1, 'POINT')}">8.0</td>
                <td class="text-end text-nowrap">
                    <a th:href="@{/admin/movies/{id}/edit(id=${movie.id})}" class="btn btn-sm btn-outline-primary">Изменить</a>
                    <form th:action="@{/admin/movies/{id}/delete(id=${movie.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Удалить фильм?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
