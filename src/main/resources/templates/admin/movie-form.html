<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${movieForm.id == null} ? 'Новый фильм' : 'Изменение фильма')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container mb-5">
    <h1>Админка</h1>
    <div th:replace="~{fragments/layout :: adminTabs('movies')}"></div>

    <h2 class="h4 mb-3" th:text="${movieForm.id == null} ? 'Новый фильм' : 'Изменение: ' + ${movieForm.title}">Новый фильм</h2>

    <!-- Новый фильм отправляется на /admin/movies, существующий — на /admin/movies/{id} -->
    <form th:object="${movieForm}" method="post" novalidate
          th:action="${movieForm.id == null} ? @{/admin/movies} : @{/admin/movies/{id}(id=${movieForm.id})}">

        <div class="row g-3">
            <div class="col-md-6">
                <label for="title" class="form-label">Название</label>
                <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>
            <div class="col-md-2">
                <label for="year" class="form-label">Год</label>
                <input type="number" th:field="*{year}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{year}"></div>
            </div>
            <div class="col-md-2">
                <label for="rating" class="form-label">Рейтинг (0–10)</label>
                <input type="number" step="0.1" min="0" max="10" th:field="*{rating}" class="form-control"
                       th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{rating}"></div>
            </div>
            <div class="col-md-2">
                <label for="typeId" class="form-label">Тип</label>
                <select th:field="*{typeId}" class="form-select" th:errorclass="is-invalid">
                    <option value="">—</option>
                    <option th:each="type : ${types}" th:value="${type.id}" th:text="${type.name}">тип</option>
                </select>
                <div class="invalid-feedback" th:errors="*{typeId}"></div>
            </div>

            <div class="col-12">
                <label for="description" class="form-label">Описание</label>
                <textarea th:field="*{description}" rows="4" class="form-control" th:errorclass="is-invalid"></textarea>
                <div class="invalid-feedback" th:errors="*{description}"></div>
            </div>

            <div class="col-12">
                <label for="posterUrl" class="form-label">Ссылка на постер <span class="text-muted">(необязательно)</span></label>
                <input type="text" th:field="*{posterUrl}" class="form-control" th:errorclass="is-invalid"
                       placeholder="https://...">
                <div class="invalid-feedback" th:errors="*{posterUrl}"></div>
            </div>

            <div class="col-12">
                <div class="form-label">Жанры</div>
                <div class="form-check form-check-inline" th:each="genre : ${genres}">
                    <input class="form-check-input" type="checkbox" name="genreIds"
                           th:id="'genre' + ${genre.id}" th:value="${genre.id}"
                           th:checked="${#lists.contains(movieForm.genreIds, genre.id)}">
                    <label class="form-check-label" th:for="'genre' + ${genre.id}" th:text="${genre.name}">жанр</label>
                </div>
                <div class="text-danger small" th:errors="*{genreIds}"></div>
            </div>

            <div class="col-12">
                <div class="form-label">Настроение</div>
                <div class="form-check form-check-inline" th:each="mood : ${moods}">
                    <input class="form-check-input" type="checkbox" name="moodIds"
                           th:id="'mood' + ${mood.id}" th:value="${mood.id}"
                           th:checked="${#lists.contains(movieForm.moodIds, mood.id)}">
                    <label class="form-check-label" th:for="'mood' + ${mood.id}" th:text="${mood.name}">настроение</label>
                </div>
                <div class="text-danger small" th:errors="*{moodIds}"></div>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a th:href="@{/admin/movies}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
