spring.application.name=cinerec

# Подключение к PostgreSQL. Логин и пароль берутся из переменных окружения,
# чтобы не хранить их в репозитории.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/cinerec
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Схему создаёт Flyway (src/main/resources/db/migration),
# Hibernate только проверяет, что сущности ей соответствуют.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

# Файл обученной модели настроений (создаётся командой ./mvnw compile exec:java)
cinerec.model.path=ml/mood-model.model

# Модель для чата (создаётся той же командой)
cinerec.chat-model.path=ml/chat-model.model

# Администратор (вход в /admin и /api/admin). Пароль обязателен, задаётся в .env
cinerec.admin.username=${ADMIN_USERNAME:admin}
cinerec.admin.password=${ADMIN_PASSWORD:}
