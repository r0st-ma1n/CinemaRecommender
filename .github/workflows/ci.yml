# Проверка на каждый push и pull request: тесты бэкенда и фронтенда, сборка Docker-образов.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Бэкенд (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Интеграционные тесты поднимают PostgreSQL через Testcontainers — Docker на раннере уже есть
      - run: ./mvnw -B test

  frontend:
    name: Фронтенд (Vitest, сборка)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker-образы
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cinerec-app .
      - run: docker build -t cinerec-frontend frontend
